spring.application.name=chemiconsult

# ── Base de datos ──────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chemiconsult}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ── JPA / Hibernate ────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.defer-datasource-initialization=true

# ── SQL init ───────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.continue-on-error=true

# ── JWT ────────────────────────────────────────
jwt.secret=${JWT_SECRET:your_very_secure_secret_key_with_at_least_32_characters}
jwt.expiration=3600000

# ── Supabase ───────────────────────────────────
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# ── Brevo ──────────────────────────────────────
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=Chemiconsult

# ── Jackson ────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging (prod: WARN, local: override en application-local.properties) ──
logging.level.org.springframework.security=warn
logging.level.root=warn

# ── Actuator / Health ──────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=true
