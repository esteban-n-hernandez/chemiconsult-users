<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Parametros a analizar - CHEMICONSULT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/sidebar.css"/>
    <link rel="stylesheet" href="css/ui.css"/>
    <link rel="stylesheet" href="css/cola-analisis.css"/>
    <link rel="stylesheet" href="css/modal.css"/>
    <script src="js/auth.js" data-roles="ROLE_IT,ROLE_EMPLEADO" data-modulo="COLA_ANALISIS"></script>
</head>
<body>

<div id="sidebar-container"></div>

<div class="content">

    <div class="page-header">
        <div>
            <h1>Parametros a analizar</h1>
            <p id="fecha-hoy">Gestión de parámetros asignados</p>
        </div>
        <div class="header-user">
            <div class="header-user-info">
                <p class="header-user-name" id="header-nombre">—</p>
                <p class="header-user-role" id="header-rol">—</p>
            </div>
            <div class="avatar-circle" id="header-avatar">--</div>
        </div>
    </div>

    <!-- Filtro por empleado -->
    <div class="mc-user-filter-bar" id="mcUserFilterBar">
        <span class="mc-user-filter-label">Ver</span>
        <div class="mc-user-pills" id="mcUserPills">
            <!-- pills generadas por JS -->
        </div>
    </div>

    <!-- Stats -->
    <div class="mc-stats-row" id="mcStats" style="display:none">
        <div class="mc-stat-chip mc-stat-pendiente">
            <i class="bi bi-hourglass-split"></i>
            <span id="statPendientes">0</span> Pendiente
        </div>
        <div class="mc-stat-chip mc-stat-analizado">
            <i class="bi bi-check2-circle"></i>
            <span id="statAnalizado">0</span> Analizado
        </div>
        <div class="mc-stat-chip mc-stat-confirmado">
            <i class="bi bi-patch-check"></i>
            <span id="statConfirmado">0</span> Confirmado
        </div>
        <div class="mc-stat-chip mc-stat-repetir">
            <i class="bi bi-arrow-repeat"></i>
            <span id="statRepetir">0</span> Repetir
        </div>
    </div>

    <!-- Toolbar -->
    <div class="mc-toolbar">
        <div class="mc-search-wrap">
            <i class="bi bi-search mc-search-icon"></i>
            <input type="text" id="mcSearch" class="mc-search" placeholder="Buscar parámetro o muestra…"/>
        </div>
        <div class="mc-filter-btns">
            <button class="mc-filter-btn active" data-filtro="todos">Todos</button>
            <button class="mc-filter-btn" data-filtro="PENDIENTE">Pendiente</button>
            <button class="mc-filter-btn" data-filtro="ANALIZADO">Analizado</button>
            <button class="mc-filter-btn" data-filtro="REPETIR"> Repetir</button>
        </div>
        <button class="mc-btn-refresh" id="mcRefresh" title="Actualizar">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>

    <!-- Lista de parámetros -->
    <div id="mcLista"></div>

    <!-- Empty -->
    <div class="mc-empty" id="mcEmpty" style="display:none">
        <i class="bi bi-check2-all"></i>
        <p>Sin parámetros asignados</p>
    </div>

</div>

<!-- Dropdown estado análisis -->
<div id="mcEstadoDrop" class="mc-estado-drop" style="display:none;">
    <button class="mc-estado-opt pendiente" data-estado="PENDIENTE">
        <span class="mc-estado-dot"></span> Pendiente
    </button>
    <button class="mc-estado-opt analizado" data-estado="ANALIZADO">
        <span class="mc-estado-dot"></span> Analizado
    </button>
    <button class="mc-estado-opt confirmado" data-estado="CONFIRMADO">
        <span class="mc-estado-dot"></span> Confirmado
    </button>
    <button class="mc-estado-opt repetir" data-estado="REPETIR">
        <span class="mc-estado-dot"></span> Repetir
    </button>
</div>

<!-- Modal confirmar resultado -->
<div class="modal-overlay" id="mcModalConfirmar">
    <div class="modal-box modal-box-detalle">
        <div class="modal-loading-overlay d-none" id="mcModalLoading">
            <div class="tube-loader">
                <div class="tube-cap"></div>
                <div class="tube-body"><div class="tube-liquid"></div></div>
            </div>
            <p class="modal-loading-label">Cargando datos…</p>
        </div>
        <div class="modal-header">
            <div class="mh-icon"><i class="bi bi-patch-check-fill"></i></div>
            <div class="mh-info">
                <p class="mh-eyebrow">Confirmar análisis</p>
                <h5 id="mcModalParamNombre">—</h5>
            </div>
            <button class="modal-close" id="mcModalCerrar"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <div class="mc-modal-info-grid">
                <div class="mc-modal-info-item">
                    <span class="mc-modal-info-label">N° Protocolo</span>
                    <span class="mc-modal-info-val mc-modal-info-mono" id="mcModalProto">—</span>
                </div>
                <div class="mc-modal-info-item">
                    <span class="mc-modal-info-label">Cliente</span>
                    <span class="mc-modal-info-val" id="mcModalCliente">—</span>
                </div>
                <div class="mc-modal-info-item">
                    <span class="mc-modal-info-label">Punto de muestreo</span>
                    <span class="mc-modal-info-val" id="mcModalPunto">—</span>
                </div>
                <div class="mc-modal-info-item">
                    <span class="mc-modal-info-label">Unidad</span>
                    <span class="mc-modal-info-val" id="mcModalUnidad">—</span>
                </div>
            </div>
            <div class="form-group">
                <label>Metodología</label>
                <select id="mcModalMetodo" class="form-control-custom">
                    <option value="">Sin metodología</option>
                </select>
            </div>
            <div class="form-group" id="mcModalLimitesWrap">
                <label>Límites aplicables</label>
                <div id="mcModalLimites" class="mc-modal-limites-container">
                    <span class="mc-modal-limites-empty">—</span>
                </div>
            </div>
            <div class="form-group">
                <label>
                    Resultado
                    <span id="mcModalUnidadInline" class="mc-modal-unidad-inline"></span>
                </label>
                <input type="text" id="mcModalResultado" class="form-control-custom" placeholder="Ingresá el valor…"/>
            </div>
            <div class="form-group">
                <label>Observación <span class="task-opt">(opcional)</span></label>
                <input type="text" id="mcModalObservacion" class="form-control-custom" placeholder="Sin observaciones…"/>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancelar" id="mcModalCancelarBtn">Cancelar</button>
            <button class="btn-guardar" id="mcModalGuardarBtn">
                <i class="bi bi-patch-check-fill"></i> Confirmar
            </button>
        </div>
    </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/cola-analisis.js"></script>
</body>
</html>
